name: Prepublish Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepublish-gate:
    name: npm test + npm run build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prepublish test gate
        run: npm test

      - name: Run prepublish build gate
        run: npm run build
